name: Release (Windows)

# 推送 v* 标签时在 GitHub 的 Windows 机器上构建安装程序与免安装 ZIP，并上传到同名 Release。
# Release 不存在时先建草稿，macOS DMG 可以随后补进同一个 Release 再发布。
on:
  push:
    tags: ["v*"]
  # 改动本工作流的 PR 只试打包，不上传。
  pull_request:
    paths: [".github/workflows/release-windows.yml", "xtask/src/windows.rs", "packaging/windows/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并上传的标签（如 v1.0.2）"
        required: true

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || (github.event_name == 'pull_request' && 'pr-dry-run') || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || env.TAG }}
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Check tag matches workspace version
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='kanso-gpui'))")
          if [ "v$version" != "$TAG" ]; then
            echo "标签 $TAG 与 kanso-gpui 版本 $version 不一致" >&2
            exit 1
          fi
      - name: Build installer and portable ZIP
        env:
          # 找不到 rc.exe 时直接失败，不发没有图标与版本信息的 exe。
          KANSO_REQUIRE_RESOURCES: "1"
        run: cargo xtask win-package
      - name: Upload to GitHub Release
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          cd target/win-package
          ls -l
          files=(Kanso-*-x64-setup.exe Kanso-*-x64-setup.exe.sha256 Kanso-*-x64-portable.zip Kanso-*-x64-portable.zip.sha256)
          for f in "${files[@]}"; do [ -f "$f" ] || { echo "缺少 $f" >&2; exit 1; }; done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "Kanso ${TAG#v}" --notes "Windows 安装包由 CI 构建，未签名。"
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

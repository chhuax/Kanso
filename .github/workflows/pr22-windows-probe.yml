name: PR22 Windows probe
on:
  push:
    branches: [codex/pr22-windows-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          save-if: false
      - name: Trace PowerShell ConPTY input
        run: |
          cargo test --locked -p kanso-session --test local_session_windows --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:KANSO_PTY_PROBE = 'timeout'
          foreach ($attempt in 1..3) {
            Write-Host "::group::Concurrent original scenarios, attempt $attempt"
            cargo test --locked -p kanso-session --test local_session_windows -- --nocapture --test-threads=4
            $result = $LASTEXITCODE
            Write-Host "attempt $attempt exit=$result"
            Write-Host '::endgroup::'
            if ($result -ne 0) { exit $result }
          }

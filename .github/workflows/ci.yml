name: CI

on:
  # push 只跑 main：分支上的改动由 PR 触发，避免同一提交跑两遍。
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支有新推送时，进行中的旧运行已无意义，直接取消。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 与 App 的最低系统版本一致。不设时 cc 编译的 C 依赖（ring、aws-lc 等）按机器 SDK 版本编译，
# 链接时会对每个目标文件刷一行 "built for newer macOS version" 警告。
env:
  MACOSX_DEPLOYMENT_TARGET: "14.0"

# 任务名 rust / macos 与分支保护要求的检查名保持一致。
# macos 是汇总任务：arm64 Direct 与 Intel 并行，它只负责等它们都成功。
jobs:
  rust:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # 直接下载编好的 cargo-deny，比 cargo install 从源码编译快约 90 秒。
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check Rust, bindings, tokens and locales
        run: cargo xtask ci --skip-apple

  # Rust 核心三平台共享：Windows / Linux 只跑平台无关的检查。
  # 绑定校验、Apple 构建、渠道矩阵、c-abi 与 cargo deny 仅在 macOS job 中执行。
  rust-portable:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Install zsh (kanso-pty zsh shim tests)
        if: runner.os == 'Linux'
        # Ubuntu 的 /etc/zsh/zshrc 会运行 compinit；runner 上部分补全目录可被组或其他人写入，
        # zsh 会停下来询问 "Ignore insecure directories"，测试等不到提示符。收紧这些目录的权限。
        run: |
          sudo apt-get update && sudo apt-get install -y zsh
          zsh -fc 'autoload -U compaudit; compaudit' | xargs -r sudo chmod go-w
      - uses: Swatinem/rust-cache@v2.7.8
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Check design tokens
        run: cargo run --quiet -p xtask -- check-tokens
      - name: Check locales
        run: cargo run --quiet -p xtask -- check-locales

  # Direct 编完立刻测。x86_64 在 Intel 机器上同时编，不再排在测试后面。
  macos-arm64:
    name: macos (arm64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Direct channel
        run: cargo xtask apple-build --channel direct
      # Swift 单元测试。以前只在本地 `cargo xtask ci` 里跑，两个分支各自通过、合并后才失败的情况
      # 在 GitHub 上看不出来（#20 合并时即如此）。测试本身隔离了钥匙串、HOME 与剪贴板，可以在 runner 上跑。
      # 跳过像素比对的截图测试：参考图在开发机上录制，runner 的 macOS 版本、字体光栅化和 Metal（虚拟机里
      # 可能没有）都不同，比对结果反映的是环境差异而不是回归。截图测试仍由本地 `cargo xtask ci` 覆盖。
      - name: Swift tests
        run: >-
          cargo xtask apple-test
          --skip-testing KansoTests/SnapshotTests
          --skip-testing KansoTests/UISnapshotTests

  # Intel 机器原生编译。不再在 arm64 上交叉编译 x86_64-apple-darwin。
  macos-intel:
    name: macos (x86_64)
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-ffi
      - name: Build Direct static lib (x86_64)
        run: cargo build -p kanso-ffi

  macos:
    needs: [macos-arm64, macos-intel]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm arm64 and Intel
        run: |
          for result in \
            "${{ needs.macos-arm64.result }}" \
            "${{ needs.macos-intel.result }}"
          do
            [ "$result" = success ] || {
              echo "构建未全部成功：arm64=${{ needs.macos-arm64.result }} x86_64=${{ needs.macos-intel.result }}" >&2
              exit 1
            }
          done

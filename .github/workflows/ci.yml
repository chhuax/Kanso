name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check Rust, bindings, tokens and locales
        run: cargo xtask ci --skip-apple

  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Direct channel
        run: cargo xtask apple-build --channel direct

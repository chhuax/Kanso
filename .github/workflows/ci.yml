name: CI

on:
  # push 只跑 main：分支上的改动由 PR 触发，避免同一提交跑两遍。
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支有新推送时，进行中的旧运行已无意义，直接取消。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 与 App 的最低系统版本一致。不设时 cc 编译的 C 依赖（ring、aws-lc 等）按机器 SDK 版本编译，
# 链接时会对每个目标文件刷一行 "built for newer macOS version" 警告。
env:
  MACOSX_DEPLOYMENT_TARGET: "14.0"

# 任务名 rust / apple 是分支保护要求的检查名，不要改。
jobs:
  rust:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # 直接下载编好的 cargo-deny，比 cargo install 从源码编译快约 90 秒。
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check Rust, bindings, tokens and locales
        run: cargo xtask ci --skip-apple

  apple:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install XcodeGen
        run: brew install xcodegen
      # 只编 Direct：MAS / Setapp 的 Rust 部分已在 rust 任务的渠道矩阵里检查，Swift 里按渠道区分的代码很少；
      # 三个渠道都编要多花约 3 分钟。本地 `cargo xtask ci` 仍编三个渠道兜底。
      - name: Build Direct channel
        run: cargo xtask apple-build --channel direct

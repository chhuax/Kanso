[package]
name = "kanso-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# staticlib 用于打包 XCFramework；lib 保留给 Rust 侧测试与依赖方。
crate-type = ["lib", "staticlib"]

[dependencies]
kanso-core = { workspace = true, default-features = false }
kanso-mcp-server = { workspace = true, default-features = false }
kanso-frame.workspace = true
kanso-term.workspace = true
kanso-secret.workspace = true
kanso-types.workspace = true
kanso-l10n.workspace = true
kanso-license.workspace = true
uniffi.workspace = true

[features]
default = ["direct"]
direct = ["kanso-core/direct", "kanso-mcp-server/direct"]
mas = ["kanso-core/mas", "kanso-mcp-server/mas"]
setapp = ["kanso-core/setapp", "kanso-mcp-server/setapp"]

# 本 crate 将来必须使用 unsafe（extern "C" 与 UniFFI 生成代码），因此不继承 workspace lints，
# 而是显式列出与 workspace 相同的规则，仅把 unsafe_code 放开为 allow。
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "kanso-mcp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Kanso 的 MCP 服务（spec/mcp.md、architecture §16）：App 进程内的 MCP 服务端"

[dependencies]
kanso-core = { workspace = true, default-features = false }
kanso-types.workspace = true
# 以下只在 Direct 渠道（真实服务）需要，设为可选依赖由 `direct` 打开，MAS / Setapp 不编译它们。
kanso-mcp = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
libc = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt"] }
serde_json.workspace = true

[features]
default = ["direct"]
# 只有 Direct 渠道包含真实服务；其他渠道的 `McpServer` 只报告"不支持"（spec/mcp.md §11）。
# 公开接口在所有渠道都存在，因为 Swift 绑定只生成一份、三个渠道共用。
direct = [
    "kanso-core/direct",
    "dep:kanso-mcp",
    "dep:rmcp",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
    "dep:libc",
    "dep:tracing",
    "dep:tokio-util",
]
mas = ["kanso-core/mas"]
setapp = ["kanso-core/setapp"]

# 真实服务要直接调 libc（flock、getpeereid、取对端 pid、进程祖先链），因此不继承 workspace lints，
# 显式列出与 workspace 相同的规则，仅把 unsafe_code 放开为 allow；每处 unsafe 写 SAFETY 注释。
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }

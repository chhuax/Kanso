[package]
name = "kanso-ssh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kanso-types.workspace = true
russh.workspace = true
hmac.workspace = true
sha1.workspace = true
base64.workspace = true
bytes.workspace = true
# known_hosts 的 replace_all 需要同目录临时文件 + 原子 rename。
tempfile.workspace = true
# 库内用到 net（TCP / unix socket）、time（超时）、sync（watch / Mutex）、io-util、
# process（ProxyCommand 子进程）、macros（监督任务的 select!）；不创建 runtime。
tokio = { workspace = true, features = ["net", "time", "sync", "io-util", "rt", "fs", "process", "macros"] }

[features]
# 暴露进程内 russh 测试服务器（`kanso_ssh::test_server`），供 core / session 的集成测试复用。
# 只能在 dev-dependencies 里启用，产品构建不得打开。
test-server = []

[dev-dependencies]
# 测试里需要 #[tokio::test]、暂停时钟（test-util）和进程内 russh server。
tokio = { workspace = true, features = ["macros", "test-util"] }
futures.workspace = true
sha2.workspace = true

[lints]
workspace = true

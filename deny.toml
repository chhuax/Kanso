# cargo-deny 配置：许可证、依赖来源与重复版本检查。

# 只检查实际发布平台会编译的依赖。不设置时 cargo-deny 按所有目标平台展开依赖图，
# 只在 wasm32 等我们不发布的平台上才引入的依赖也会被检查，产生与产品无关的告警
# （例如 russh-util 仅在 wasm32 下依赖的 chrono，RUSTSEC-2026-0543）。
# 新增发布平台或架构时必须把对应 target 加进来，否则它独有的依赖不会被检查。
[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
ignore = [
    # basic-toml（已停止维护）只经 uniffi_bindgen -> askama 进入依赖图，即只存在于绑定生成工具
    # `crates/uniffi-bindgen`（由 `cargo xtask bindgen` 运行），不进入 kanso-ffi、静态库与任何发布产物。
    # 上游（askama / uniffi）换掉它之后应删除本条。
    { id = "RUSTSEC-2026-0374", reason = "仅构建期绑定生成工具使用，不随产品分发" },
    # rsa（Marvin 计时侧信道）：advisory 正文写明 0.10 系列已迁到 crypto-bigint 并完成常量时间修复，
    # 但 patched 范围写成 ">= 0.10.0"，预发布版 0.10.0-rc.* 仍被标记。russh 精确锁定了 rsa 0.10.0-rc.18，
    # 无法单独升级；不启用 rsa 特性就不能使用 ssh-rsa 主机与用户密钥（大量网络设备只有 RSA）。
    # 另外客户端每次认证只做一次签名，远程攻击者难以收集到足够的计时样本。
    # 经用户确认（2026-11-14）。russh 升级到 rsa >= 0.10.0 后删除本条。
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.10 预发布版已含修复，被 russh 精确锁定；升级后删除" },
    # zbus 5.x 的 zvariant / zvariant_derive / zbus_names 被标记为“不再作为独立 crate 维护”（zbus 6 起合并），
    # 这是维护状态告警而不是漏洞。它们只经 secret-service 5.2.0 -> zbus 5 进入依赖图，
    # 且仅在 Linux 目标（kanso-secret 的 Secret Service 后端）下编译，不进入 macOS 产物。
    # 升级方案 secret-service 6.0.0（基于 zbus 6）目前只有 rc 版（2026-11 发布），暂不采用；
    # oo7 0.7 需要 Rust 1.95，高于本仓库固定的 1.94.1。secret-service 6 正式发布后升级并删除这三条。
    # 经用户确认（2026-11-16）。
    { id = "RUSTSEC-2026-0370", reason = "zvariant 维护状态告警，仅 Linux 的 Secret Service 后端使用；等 secret-service 6 正式版" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 维护状态告警，同上" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 维护状态告警，同上" },
    # chrono（停止维护，维护状态告警而不是漏洞）：MCP 官方 SDK rmcp 在原生平台上无条件依赖它
    # （数据模型直接使用 chrono::DateTime），并为 schemars 打开了 chrono04。只随 Direct 渠道的
    # kanso-mcp-server 编译进产品（MAS / Setapp 不启用 rmcp）。不自己实现 MCP 协议，换取协议合规由官方 SDK 负责。
    # 经用户确认（2026-11-17）。rmcp 换掉 chrono 后删除本条。
    { id = "RUSTSEC-2026-0543", reason = "chrono 维护状态告警，经 rmcp 进入 Direct 版；等 rmcp 换掉 chrono" },
]

[licenses]
version = 2
# 不在 allow 列表内的许可证一律被拒，因此 GPL / LGPL / AGPL 天然被禁止，不要加入。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.93
exceptions = [
    # MPL-2.0 是文件级 copyleft：不修改其源码即可闭源使用，
    # 但需在第三方许可页写明源码获取方式（architecture.md §15）。
    # 只放行 uniffi 家族，其他 crate 引入 MPL-2.0 仍会被拒。
    { allow = ["MPL-2.0"], crate = "uniffi" },
    { allow = ["MPL-2.0"], crate = "uniffi_bindgen" },
    { allow = ["MPL-2.0"], crate = "uniffi_build" },
    { allow = ["MPL-2.0"], crate = "uniffi_checksum_derive" },
    { allow = ["MPL-2.0"], crate = "uniffi_core" },
    { allow = ["MPL-2.0"], crate = "uniffi_internal_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_meta" },
    { allow = ["MPL-2.0"], crate = "uniffi_pipeline" },
    { allow = ["MPL-2.0"], crate = "uniffi_udl" },
    # CC0-1.0 是公有领域贡献声明，比 MIT 更宽松，FSF 认定与 GPL 兼容；不授予专利权，
    # 对解析十六进制浮点数的小库影响可忽略。经 gpui → blade-graphics → naga 引入（Windows/Linux 前端）。
    # 只放行这一个 crate，其他 crate 引入 CC0 仍会被拒。经用户确认（2026-11-16）。
    { allow = ["CC0-1.0"], crate = "hexf-parse" },
]

[licenses.private]
# workspace 内部 crate 都是 publish = false 的私有 crate，不参与许可证检查。
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# workspace 内部 path 依赖没有版本号，需要放行。
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
